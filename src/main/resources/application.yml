server:
  port: 8080
spring:
  application:
    name: yunxiutongDispatchSystem
  profiles:
    active: dev
  ai:
    openai:
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
      embedding:
        base-url: https://maas.qianwenaiapi.com/compatible-mode
        options:
          model:  qwen3.7-text-embedding-flash
  datasource:
    driver-class-name: ${YXT.datasource.driver-class-name}
    username: ${YXT.datasource.username}
    password: ${YXT.datasource.password}
    url:  jdbc:mysql://${YXT.datasource.host}:${YXT.datasource.port}/${YXT.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true

  data:
    redis:
      host: ${STYX.data.redis.host}
#      password: ${STYX.data.redis.password}
      lettuce:
        pool:
          max-active: ${STYX.data.redis.lettuce.pool.max-active}
          min-idle: ${STYX.data.redis.lettuce.pool.min-idle}
          max-idle: ${STYX.data.redis.lettuce.pool.max-idle}
      port: ${STYX.data.redis.port}
      database: 1
mybatis:
  configuration:
    #??????
    map-underscore-to-camel-case: true
  #????
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.entity
logging:
  level:
    org:
      example:
        mapper: debug
        service:  info
        controller: info
yxt:
  jwt:
    adminSecretKey: ${JWT_ADMIN_SECRET:yxt-dev-admin-key-change-in-prod-2026-extra-secret}
    adminTtl: 72000000
    adminTokenName: token
    user-secret-key: ${JWT_USER_SECRET:yxt-dev-user-key-change-in-prod-2026-extra-secret}
    user-token-name: token
    user-ttl: 72000000
    worker-secret-key: ${JWT_WORKER_SECRET:yxt-dev-worker-key-change-in-prod-2026-extra-secret}
    worker-token-name: token
    worker-ttl: 72000000
#向量数据库的相关配置
ai:
  vector:
    url:  jdbc:postgresql://localhost:5432/yunxiutong_ai
    username: postgres


